<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-logo mx-auto mb-2" style="background:#e3eefd"><i class="bi bi-compass"></i></div>
      <h4 class="fw-bold mb-0" id="brandName">Đắk Lắk Travel</h4>
      <div class="text-muted small">Trang quản trị</div>
    </div>

    <h6 class="fw-semibold mb-3">Đăng nhập Admin</h6>
    <div id="error" class="alert alert-danger py-2 d-none"></div>

    <form id="loginForm">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input id="email" type="email" class="form-control" placeholder="Email" required autofocus>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input id="password" type="password" class="form-control" placeholder="Mật khẩu" required>
      </div>
      <button id="submitBtn" class="btn btn-primary w-100 py-2" type="submit">Đăng nhập</button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">Chỉ dành cho tài khoản quản trị</p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
