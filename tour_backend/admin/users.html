<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <div id="alerts"></div>

        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <h4 class="fw-bold mb-0 me-auto">Quản lý người dùng</h4>
        </div>

        <div class="card-box">
          <div class="row g-2 mb-3">
            <div class="col-lg-6">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input id="search" class="form-control" placeholder="Tìm theo tên, email, số điện thoại...">
              </div>
            </div>
            <div class="col-sm-6 col-lg-3">
              <select id="filterRole" class="form-select">
                <option value="">Tất cả vai trò</option>
                <option value="user">Người dùng</option>
                <option value="admin">Quản trị viên</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <select id="filterStatus" class="form-select">
                <option value="">Tất cả trạng thái</option>
                <option value="active">Hoạt động</option>
                <option value="locked">Bị khóa</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th style="width:48px">#</th>
                  <th>Người dùng</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Trạng thái</th>
                  <th>Ngày đăng ký</th>
                  <th title="Số địa điểm đã yêu thích">Yêu thích</th>
                  <th style="width:96px">Thao tác</th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr><td colspan="8" class="text-center text-muted py-4">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2">
            <small class="text-muted" id="info"></small>
            <ul class="pagination pagination-sm mb-0" id="pager"></ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Sửa người dùng -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="userForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Sửa người dùng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="userAlert"></div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="u-name">Họ và tên <span class="text-danger">*</span></label>
            <input id="u-name" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="u-email">Email</label>
            <input id="u-email" class="form-control" readonly>
          </div>
          <div class="mb-1">
            <label class="form-label fw-semibold" for="u-role">Vai trò</label>
            <select id="u-role" class="form-select">
              <option value="user">Người dùng</option>
              <option value="admin">Quản trị viên</option>
            </select>
            <div class="form-text" id="u-roleHint">Quản trị viên có thể đăng nhập trang quản trị và thay đổi mọi dữ liệu.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
          <button id="userSaveBtn" type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
