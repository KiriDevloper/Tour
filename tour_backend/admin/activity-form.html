<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thêm / Sửa hoạt động</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <div class="d-flex align-items-center mb-3">
          <h4 class="fw-bold mb-0 me-auto" id="pageTitle">Thêm hoạt động</h4>
          <a href="activities.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại</a>
        </div>

        <div id="formAlert"></div>

        <form id="activityForm" class="card-box" novalidate>
          <div class="row g-4">
            <div class="col-lg-6">
              <div class="mb-3">
                <label class="form-label" for="f-place">Địa điểm <span class="text-danger">*</span></label>
                <select id="f-place" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="f-name">Tên hoạt động <span class="text-danger">*</span></label>
                <input id="f-name" class="form-control" placeholder="Ví dụ: Tham quan nhà dài Ê Đê" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="f-desc">Mô tả <span class="text-danger">*</span></label>
                <textarea id="f-desc" class="form-control" rows="6" placeholder="Hoạt động gồm những gì, thời gian, lưu ý..." required></textarea>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="mb-3">
                <label class="form-label" for="f-image-file">Ảnh hoạt động</label>
                <div class="cover-box">
                  <input id="f-image-file" type="file" accept="image/jpeg,image/png,image/webp" class="form-control">
                  <div class="form-text">JPG, PNG, WEBP (tối đa 5MB)</div>
                  <input id="f-image" type="hidden">
                  <div id="imageWrap" class="mt-2 d-none">
                    <img id="imagePreview" alt="" style="max-height:150px;border-radius:10px">
                    <div><button type="button" id="removeImage" class="btn btn-link btn-sm text-danger px-0">Xóa ảnh</button></div>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" role="switch" id="f-own">
                  <label class="form-check-label fw-semibold" for="f-own">Hoạt động diễn ra ở vị trí riêng</label>
                </div>
                <div class="form-text mb-2" id="ownHint">Đang dùng vị trí của địa điểm đã chọn trên bản đồ. Bật nếu hoạt động diễn ra ở chỗ khác.</div>
                <div id="ownBox" class="d-none">
                  <input id="f-coords" class="form-control mb-2" placeholder="Dán tọa độ từ Google Maps, ví dụ: 12.667, 108.038">
                  <div class="row g-2">
                    <div class="col-6">
                      <label class="form-label" for="f-lat">Vĩ độ</label>
                      <input id="f-lat" class="form-control" inputmode="decimal">
                    </div>
                    <div class="col-6">
                      <label class="form-label" for="f-lng">Kinh độ</label>
                      <input id="f-lng" class="form-control" inputmode="decimal">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="activities.html" class="btn btn-outline-secondary">Hủy</a>
            <button id="saveBtn" type="submit" class="btn btn-primary px-4">Lưu</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/activity-form.js"></script>
</body>
</html>
