<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thêm / Sửa địa điểm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <div class="d-flex align-items-center mb-3">
          <h4 class="fw-bold mb-0 me-auto" id="pageTitle">Thêm địa điểm</h4>
          <a href="places.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại</a>
        </div>

        <div id="formAlert"></div>

        <form id="placeForm" class="card-box" novalidate>
          <div class="row g-4">
            <!-- Cột trái -->
            <div class="col-lg-6">
              <div class="mb-3">
                <label class="form-label" for="f-name">Tên địa điểm <span class="text-danger">*</span></label>
                <input id="f-name" class="form-control" placeholder="Nhập tên địa điểm" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="f-category">Loại địa điểm <span class="text-danger">*</span></label>
                <select id="f-category" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="f-address">Địa chỉ <span class="text-danger">*</span></label>
                <input id="f-address" class="form-control" placeholder="Nhập địa chỉ" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="f-cover">Ảnh bìa</label>
                <div class="cover-box">
                  <input id="f-cover" type="file" accept="image/jpeg,image/png,image/webp" class="form-control">
                  <div class="form-text">JPG, PNG, WEBP (tối đa 5MB)</div>
                  <input id="f-coverImage" type="hidden">
                  <div id="coverWrap" class="mt-2 d-none">
                    <img id="coverPreview" alt="">
                    <div><button type="button" id="removeCover" class="btn btn-link btn-sm text-danger px-0">Xóa ảnh bìa</button></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Cột phải -->
            <div class="col-lg-6">
              <div class="mb-3">
                <label class="form-label" for="f-coords">Dán tọa độ từ Google Maps</label>
                <input id="f-coords" class="form-control" placeholder="Ví dụ: 12.667, 108.038">
                <div class="form-text">Chuột phải vào địa điểm trên Google Maps, bấm dòng số đầu tiên để sao chép rồi dán vào đây.</div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label class="form-label" for="f-lat">Vĩ độ (Latitude) <span class="text-danger">*</span></label>
                  <input id="f-lat" class="form-control" inputmode="decimal" placeholder="Ví dụ: 12.6784" required>
                </div>
                <div class="col-6">
                  <label class="form-label" for="f-lng">Kinh độ (Longitude) <span class="text-danger">*</span></label>
                  <input id="f-lng" class="form-control" inputmode="decimal" placeholder="Ví dụ: 108.0489" required>
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label class="form-label" for="f-hours">Giờ mở cửa</label>
                  <input id="f-hours" class="form-control" placeholder="Ví dụ: 7:30 - 22:00">
                </div>
                <div class="col-6">
                  <label class="form-label" for="f-ticket">Giá vé</label>
                  <input id="f-ticket" class="form-control" placeholder="Ví dụ: 50.000đ/người">
                </div>
                <div class="col-6">
                  <label class="form-label" for="f-rating">Điểm đánh giá (0 - 5)</label>
                  <input id="f-rating" type="number" step="0.1" min="0" max="5" class="form-control" value="0">
                </div>
                <div class="col-6">
                  <label class="form-label" for="f-ratingCount">Số lượt đánh giá</label>
                  <input id="f-ratingCount" type="number" step="1" min="0" class="form-control" value="0">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Ảnh phụ (tối đa 5)</label>
                <div id="gallery" class="gallery-grid"></div>
              </div>
            </div>

            <!-- Toàn chiều rộng -->
            <div class="col-12">
              <label class="form-label" for="f-short">Mô tả ngắn <span class="text-danger">*</span></label>
              <input id="f-short" class="form-control" placeholder="Nhập mô tả ngắn (hiển thị trong danh sách)" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-desc">Mô tả chi tiết <span class="text-danger">*</span></label>
              <textarea id="f-desc" class="form-control" rows="8" placeholder="Nhập mô tả chi tiết về địa điểm" required></textarea>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="f-visible" checked>
                <label class="form-check-label" for="f-visible">Hiển thị trên ứng dụng</label>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="places.html" class="btn btn-outline-secondary">Hủy</a>
            <button id="saveBtn" type="submit" class="btn btn-primary px-4">Lưu</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/place-form.js"></script>
</body>
</html>
