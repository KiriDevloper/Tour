<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <div id="alerts"></div>

        <h4 class="fw-bold mb-3">Tổng quan</h4>
        <div class="mb-4">
          <div class="fw-semibold fs-5" id="hello">Xin chào!</div>
          <div class="text-muted small" id="welcome"></div>
        </div>

        <div class="row g-3 mb-4" id="stats"></div>

        <div class="row g-3">
          <div class="col-lg-7">
            <div class="card-box h-100">
              <h6 class="fw-bold mb-3">Người dùng mới trong 7 ngày qua</h6>
              <canvas id="chartUsers" height="130"></canvas>
              <div id="chartMsg" class="text-muted small"></div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card-box h-100">
              <h6 class="fw-bold mb-3">Người dùng mới đăng ký</h6>
              <div id="recent"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
