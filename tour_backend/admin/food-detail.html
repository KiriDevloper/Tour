<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết món ăn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <div id="alerts"></div>

        <div class="d-flex align-items-center gap-2 mb-3">
          <h4 class="fw-bold mb-0 me-auto">Chi tiết món ăn</h4>
          <a href="foods.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại</a>
          <a href="food-form.html" id="editLink" class="btn btn-primary btn-sm"><i class="bi bi-pencil-square"></i> Chỉnh sửa</a>
        </div>

        <div class="card-box mb-4" id="foodInfo">
          <div class="text-muted">Đang tải...</div>
        </div>

        <div class="card-box">
          <div class="d-flex align-items-center mb-3">
            <h5 class="fw-bold mb-0 me-auto">Các quán nổi bật</h5>
            <button id="addSpotBtn" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Thêm quán</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th style="width:48px">#</th>
                  <th>Tên quán</th>
                  <th>Địa chỉ</th>
                  <th>Tọa độ</th>
                  <th style="width:96px">Thao tác</th>
                </tr>
              </thead>
              <tbody id="spotBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/spot-modal.js"></script>
  <script src="js/food-detail.js"></script>
</body>
</html>
