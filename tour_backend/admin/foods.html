<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý món ăn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <div id="alerts"></div>

        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <h4 class="fw-bold mb-0 me-auto">Quản lý món ăn</h4>
          <a href="food-form.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Thêm món ăn</a>
        </div>

        <div class="card-box">
          <div class="row g-2 mb-3">
            <div class="col-lg-8">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input id="search" class="form-control" placeholder="Tìm kiếm món ăn...">
              </div>
            </div>
            <div class="col-lg-4">
              <select id="filterKind" class="form-select"><option value="">Tất cả loại</option></select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th style="width:48px">#</th>
                  <th style="width:76px">Ảnh</th>
                  <th>Tên món ăn</th>
                  <th>Loại</th>
                  <th>Mô tả</th>
                  <th>Quán</th>
                  <th style="width:130px">Thao tác</th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr><td colspan="7" class="text-center text-muted py-4">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
          <small class="text-muted d-block mt-3" id="info"></small>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/foods.js"></script>
</body>
</html>
